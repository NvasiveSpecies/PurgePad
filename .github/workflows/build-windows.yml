name: Build Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build GUI
        run: pyinstaller -y --onedir --windowed --name PurgePad --icon ../PurgePad.ico --distpath build/dist-gui --workpath build/work-gui --specpath build tools_pack.py

      - name: Build tools
        run: |
          pyinstaller -y --onefile --console --name junk_cleaner --distpath build/dist-tools/1-JunkCleaner --workpath build/work-junk_cleaner --specpath build 1-JunkCleaner/junk_cleaner.py
          pyinstaller -y --onefile --console --name startup_manager --distpath build/dist-tools/2-StartupManager --workpath build/work-startup_manager --specpath build 2-StartupManager/startup_manager.py
          pyinstaller -y --onefile --console --name duplicate_finder --distpath build/dist-tools/3-DuplicateFinder --workpath build/work-duplicate_finder --specpath build 3-DuplicateFinder/duplicate_finder.py
          pyinstaller -y --onefile --console --name disk_space --distpath build/dist-tools/4-DiskSpace --workpath build/work-disk_space --specpath build 4-DiskSpace/disk_space.py
          pyinstaller -y --onefile --console --name file_organizer --distpath build/dist-tools/5-FileOrganizer --workpath build/work-file_organizer --specpath build 5-FileOrganizer/file_organizer.py
          pyinstaller -y --onefile --console --name one_click_maintenance --distpath build/dist-tools/6-OneClickMaintenance --workpath build/work-one_click_maintenance --specpath build 6-OneClickMaintenance/one_click_maintenance.py
          pyinstaller -y --onefile --console --name pc_health_report --distpath build/dist-tools/7-PCHealthReport --workpath build/work-pc_health_report --specpath build 7-PCHealthReport/pc_health_report.py

      - name: Assemble pack
        run: |
          New-Item -ItemType Directory -Force -Path PurgePad | Out-Null
          Copy-Item -Recurse -Force build/dist-gui/PurgePad/* PurgePad/
          $tools = @("1-JunkCleaner/junk_cleaner", "2-StartupManager/startup_manager", "3-DuplicateFinder/duplicate_finder", "4-DiskSpace/disk_space", "5-FileOrganizer/file_organizer", "6-OneClickMaintenance/one_click_maintenance", "7-PCHealthReport/pc_health_report")
          foreach ($t in $tools) {
            $folder = $t.Split("/")[0]
            $stem = $t.Split("/")[1]
            New-Item -ItemType Directory -Force -Path "PurgePad/$folder" | Out-Null
            Copy-Item "build/dist-tools/$folder/$stem.exe" "PurgePad/$folder/"
          }
          Copy-Item START.txt PurgePad/START.txt

      - name: Test tool exes
        run: |
          "no" | & .\PurgePad\1-JunkCleaner\junk_cleaner.exe
          "" | & .\PurgePad\2-StartupManager\startup_manager.exe
          "no" | & .\PurgePad\6-OneClickMaintenance\one_click_maintenance.exe
          & .\PurgePad\7-PCHealthReport\pc_health_report.exe

      - name: Test GUI exe
        run: .\PurgePad\PurgePad.exe --screenshot-test

      - name: GUI interaction test on Windows
        run: |
          python -m pip install pyautogui pillow
          New-Item -ItemType Directory -Force -Path $env:TEMP\dup_test | Out-Null
          New-Item -ItemType Directory -Force -Path $env:TEMP\org_test | Out-Null
          "hello" | Out-File $env:TEMP\dup_test\a.txt
          Copy-Item $env:TEMP\dup_test\a.txt $env:TEMP\dup_test\b.txt
          "x" | Out-File $env:TEMP\org_test\photo.jpg
          "y" | Out-File $env:TEMP\org_test\note.txt
          $env:PURGEPAD_DUP_FOLDER = "$env:TEMP\dup_test"
          $env:PURGEPAD_ORG_FOLDER = "$env:TEMP\org_test"
          python gui_test.py .\PurgePad\PurgePad.exe screenshots-win

      - name: Upload Windows GUI test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PurgePad-Windows-GUI-Test
          path: screenshots-win/

      - name: Build installer
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" PurgePad-Setup.iss

      - name: Upload Windows pack
        uses: actions/upload-artifact@v4
        with:
          name: PurgePad-Windows
          path: |
            PurgePad-Setup.exe
            PurgePad/
